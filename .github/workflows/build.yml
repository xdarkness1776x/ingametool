name: Build and publish InGameTool for Dalamud
on:
  push:
    branches: [main]
    paths: ['InGameTool/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile latest.zip
          New-Item -ItemType Directory -Force "$env:APPDATA\XIVLauncher\addon\Hooks\dev" | Out-Null
          Expand-Archive -Force latest.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
      - name: Compile
        shell: pwsh
        run: dotnet build ./InGameTool/InGameTool.csproj --configuration Release -p:Platform=x64
      - name: Package and make store entry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Built files:"
          Get-ChildItem InGameTool/bin -Recurse | Select-Object -ExpandProperty FullName
          $packed = Get-ChildItem InGameTool/bin -Recurse -File -Filter latest.zip | Select-Object -First 1
          if ($packed) {
            Copy-Item $packed.FullName InGameTool.zip -Force
          } else {
            $dll = Get-ChildItem InGameTool/bin -Recurse -File -Filter InGameTool.dll | Select-Object -First 1
            $manifest = Get-ChildItem InGameTool/bin -Recurse -File -Filter InGameTool.json | Select-Object -First 1
            if (!$dll -or !$manifest) { throw 'Built plugin DLL or generated Dalamud manifest missing' }
            Compress-Archive -Path "$($dll.DirectoryName)/*" -DestinationPath InGameTool.zip -Force
          }
          New-Item -ItemType Directory -Force packaged | Out-Null
          Expand-Archive InGameTool.zip packaged -Force
          $dllCheck = Get-ChildItem packaged -Recurse -File -Filter InGameTool.dll | Select-Object -First 1
          $manifestCheck = Get-ChildItem packaged -Recurse -File -Filter InGameTool.json | Select-Object -First 1
          if (!$dllCheck -or !$manifestCheck) { throw 'Published zip is missing the plugin DLL or generated manifest' }
          $m = Get-Content $manifestCheck.FullName -Raw | ConvertFrom-Json
          if (!$m.AssemblyVersion -or !$m.DalamudApiLevel -or !$m.InternalName) { throw 'Generated manifest has missing version, Dalamud API, or internal name' }
          $tag = "v$($m.AssemblyVersion)"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/InGameTool.zip"
          $m | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $url -Force
          $m | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $url -Force
          $m | Add-Member -NotePropertyName ApplicableVersion -NotePropertyValue 'any' -Force
          $m | Add-Member -NotePropertyName RepoUrl -NotePropertyValue "https://github.com/$env:GITHUB_REPOSITORY" -Force
          $m | Add-Member -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()) -Force
          ConvertTo-Json -InputObject @($m) -Depth 20 | Set-Content -Encoding utf8 pluginmaster.json
          Write-Host "Prepared installable package for $($m.InternalName), API $($m.DalamudApiLevel), version $($m.AssemblyVersion)"
      - uses: actions/upload-artifact@v4
        with:
          name: InGameTool-package
          path: InGameTool.zip
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" InGameTool.zip --clobber
          } else {
            gh release create "$env:RELEASE_TAG" InGameTool.zip --title "$env:RELEASE_TAG" --notes "InGameTool Dalamud diagnostics"
          }
      - name: Publish Dalamud repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Publish Dalamud manifest [skip ci]"
          git push origin HEAD:main
