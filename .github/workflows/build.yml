name: Build and publish InGameTool for Dalamud
on:
  push:
    branches: [main]
    paths: ['InGameTool/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile latest.zip
          New-Item -ItemType Directory -Force "$env:APPDATA\XIVLauncher\addon\Hooks\dev" | Out-Null
          Expand-Archive -Force latest.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
      - name: Compile
        shell: pwsh
        run: dotnet build ./InGameTool/InGameTool.csproj --configuration Release -p:Platform=x64
      - name: Package and make store entry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root = 'InGameTool/bin/x64/Release'
          Get-ChildItem $root -Recurse -File | ForEach-Object { Write-Host "BUILD FILE: $($_.FullName)" }
          $dll = Get-ChildItem $root -Recurse -File -Filter 'InGameTool.dll' |
            Where-Object { $_.FullName -notmatch '[\\/]ref[\\/]' } | Select-Object -First 1
          if (!$dll) { throw 'Compiled plugin DLL missing' }
          $manifest = Get-ChildItem $root -Recurse -File -Filter 'InGameTool.json' |
            Where-Object {
              $j = Get-Content $_.FullName -Raw | ConvertFrom-Json
              $j.AssemblyVersion -and $j.DalamudApiLevel
            } | Select-Object -First 1
          if (!$manifest) { throw 'Generated Dalamud manifest with AssemblyVersion and DalamudApiLevel not found' }
          $m = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $tag = "v$($m.AssemblyVersion)"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $pack = Join-Path $env:RUNNER_TEMP 'InGameToolPackage'
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item $dll.FullName (Join-Path $pack 'InGameTool.dll')
          Copy-Item $manifest.FullName (Join-Path $pack 'InGameTool.json')
          Compress-Archive (Join-Path $pack '*') InGameTool.zip -Force
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'InGameTool.zip'))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if ('InGameTool.dll' -notin $entries -or 'InGameTool.json' -notin $entries) {
              throw 'Installation ZIP must contain DLL and manifest in the root'
            }
          } finally { $archive.Dispose() }
          # Put a versioned ZIP in the same repository hosting the pluginmaster JSON.
          # Avoid GitHub Releases redirects to the separate release-assets CDN.
          $distFile = "distribution/$tag/InGameTool.zip"
          New-Item -ItemType Directory -Force (Split-Path $distFile) | Out-Null
          Copy-Item 'InGameTool.zip' $distFile -Force
          $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/$distFile"
          $m | Add-Member NoteProperty DownloadLinkInstall $url -Force
          $m | Add-Member NoteProperty DownloadLinkUpdate $url -Force
          $m | Add-Member NoteProperty DownloadLinkTesting $url -Force
          $m | Add-Member NoteProperty ApplicableVersion 'any' -Force
          $m | Add-Member NoteProperty RepoUrl "https://github.com/$env:GITHUB_REPOSITORY" -Force
          $m | Add-Member NoteProperty LastUpdate ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()) -Force
          ConvertTo-Json -InputObject @($m) -Depth 20 | Set-Content -Encoding utf8 pluginmaster.json
      - uses: actions/upload-artifact@v4
        with:
          name: InGameTool-package
          path: InGameTool.zip
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" InGameTool.zip --clobber
          } else {
            gh release create "$env:RELEASE_TAG" InGameTool.zip --title "$env:RELEASE_TAG" --notes "InGameTool Dalamud diagnostics"
          }
      - name: Publish Dalamud repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- pluginmaster.json "distribution/$env:RELEASE_TAG/InGameTool.zip"
          git commit -m "Publish $env:RELEASE_TAG direct ZIP and manifest [skip ci]"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Repository publishing push failed' }
      - name: Verify downloadable ZIP mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/distribution/$env:RELEASE_TAG/InGameTool.zip"
          $expected = (Get-FileHash 'InGameTool.zip' -Algorithm SHA256).Hash
          $verified = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest $url -OutFile verify.zip -ErrorAction Stop
              $actual = (Get-FileHash 'verify.zip' -Algorithm SHA256).Hash
              if ($actual -ne $expected) { throw 'Downloaded package checksum mismatch' }
              $verified = $true
              break
            } catch {
              Write-Warning "Mirror verification attempt $attempt failed: $_"
              Start-Sleep -Seconds 5
            }
          }
          if (!$verified) { throw 'Published ZIP mirror could not be verified' }
